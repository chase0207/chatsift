<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Chatsift DOM 调研工具</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Chatsift DOM 调研工具</h1>
        <p>点选平台页面 DOM，导出只读 selectors.json</p>
      </div>
      <button id="authButton" class="badge" type="button">登录</button>
    </header>

    <div class="form-group">
      <label for="platformSelect">选择平台</label>
      <select id="platformSelect"></select>
    </div>

    <div class="form-group">
      <label for="pageSelect">选择页面</label>
      <select id="pageSelect"></select>
    </div>

    <div class="form-group">
      <label for="urlPattern">URL核对</label>
      <input type="text" id="urlPattern" placeholder="选择页面后自动展示" readonly>
    </div>

    <div class="helper-card">
      使用说明：该工具只生成选择器，不采集消息、不发送消息。同一个“平台-页面”的 ABC 点位会合并导出为一个 JSON。
    </div>

    <section class="progress-section">
      <div class="section-head">
        <h2>采集进度</h2>
        <span id="progressCount">0/15</span>
      </div>
      <ul id="progressList"></ul>
    </section>

    <div class="actions">
      <div class="actions-row actions-row-three">
        <button id="btnStart" class="primary">开始采集</button>
        <button id="btnStop" class="secondary" disabled>停止采集</button>
        <button id="btnReset" class="secondary">重新采集</button>
      </div>
      <div class="actions-row actions-row-two">
        <button id="btnValidate" class="secondary" disabled>立即验证</button>
        <button id="btnExport" class="primary" disabled>保存并导出JSON</button>
      </div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
