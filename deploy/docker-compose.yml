services:
  chatsift-mysql:
    image: mysql:8.0
    container_name: chatsift-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: chatsift_dev_password
      MYSQL_DATABASE: chatsift
    volumes:
      - chatsift-db:/var/lib/mysql
      - ./conf/init:/docker-entrypoint-initdb.d

  chatsift-server:
    build: ../server
    container_name: chatsift-server
    ports:
      - "3100:3100"
    depends_on:
      - chatsift-mysql
    environment:
      NODE_ENV: development
      PORT: 3100
      DB_HOST: chatsift-mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: chatsift_dev_password
      DB_NAME: chatsift
      JWT_SECRET: chatsift-v1-local-0b7b3c7a88d84d8b9c8d3e2c0f4a6b91
      JWT_EXPIRES_IN: 7d
      ANALYZER_ENABLED: "true"
      ANALYZER_POLL_INTERVAL: 1000
      ANALYZER_BATCH_SIZE: 20
      ANALYZER_MAX_ATTEMPTS: 3
      INTENT_CONTEXT_SIZE: 5
      SLA_INQUIRY_HOURS: 24
      SLA_APPOINTMENT_HOURS: 4
      SLA_COMPLAINT_HOURS: 1
      SLA_PRICING_HOURS: 2
      COMPLETENESS_CITY_LIST: 上海,北京,广州,深圳,杭州,南京,成都,武汉
      COMPLETENESS_PROJECT_LIST: 陪驾,陪练,科目二,科目三,新手上路,长途

volumes:
  chatsift-db:
