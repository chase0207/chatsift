# W16 mychat 租户入口 nginx 配置(BT 面板)
# 放置: /www/server/panel/vhost/nginx/html_mychat.kongyuekeji.com.conf
# 前置: ① mychat.kongyuekeji.com DNS A 记录 → 124.222.146.193
#       ② BT 申请 mychat 证书到 /etc/nginx/certs/mychat.kongyuekeji.com/(DNS 生效后)
# 与 admin 同一份前端(/opt/chatsift/admin/dist)+ 同一后端(127.0.0.1:3100);
# 入口区分靠前端按域名过滤(utils/entry.js),数据隔离靠后端 tenant_id(已有)。
server
{
    listen 80;
    listen [::]:80;
    server_name mychat.kongyuekeji.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/chatsift/admin/dist;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/mychat.kongyuekeji.com.log;
    error_log   /www/wwwlogs/mychat.kongyuekeji.com.error.log;
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mychat.kongyuekeji.com;
    index index.html index.htm;
    root /opt/chatsift/admin/dist;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/mychat.kongyuekeji.com/mychat.kongyuekeji.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/mychat.kongyuekeji.com/mychat.kongyuekeji.com.key;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /api {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    access_log  /www/wwwlogs/mychat.kongyuekeji.com.ssl.log;
    error_log   /www/wwwlogs/mychat.kongyuekeji.com.ssl.error.log;
}
